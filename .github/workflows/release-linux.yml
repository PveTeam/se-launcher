name: release-linux

on:
  push:
    branches: [master, preview]
  workflow_dispatch: {}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_ROLL_FORWARD: LatestMajor

jobs:
  version:
    name: Compute Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@master
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - id: version
        uses: paulhatch/semantic-version@v5.3.0
        with:
          tag_prefix: ''
          major_pattern: 'breaking:'
          minor_pattern: 'feature:'
          bump_each_commit: true
          version_format: ${{ github.ref_name == 'master' && '${major}.${minor}.${patch}' || '${major}.${minor}.${patch}-preview.${increment}' }}

  managed:
    name: Publish managed IL
    runs-on: ubuntu-latest
    needs: [version]
    steps:
      - uses: actions/checkout@master

      - uses: actions/setup-dotnet@v5

      - run: dotnet publish CringeBootstrap/CringeBootstrap.csproj -c Release -r linux-x64 -o ./il -p:Version="${{ needs.version.outputs.version }}" --no-self-contained -f net10.0
        name: Publish Project

      - run: tar -cf managed-il.tar -C il .
        name: Pack IL

      - uses: actions/upload-artifact@v3
        with:
          name: managed-il
          path: managed-il.tar
          retention-days: 7

  appdir:
    uses: https://git.zznty.net/nova/nova-dist/.github/workflows/assemble.yml@v1.0.0
    with:
      channel: preview
    secrets:
      CI_PAT: ${{ secrets.PIPELINE_PAT }}

  fetch:
    needs: [appdir]
    uses: https://git.zznty.net/nova/ci-tools/.github/workflows/fetch-appdir.yml@v1.3.1
    with:
      channel: preview
      app_key: ${{ needs.appdir.outputs.app_key }}
      expected_sha256: ${{ needs.appdir.outputs.appimage_sha256 }}
      dest: CringeLauncher.AppDir
      upload_artifact: appdir
    secrets:
      registry_token: ${{ secrets.PIPELINE_PAT }}

  pack:
    name: Pack Linux
    runs-on: ubuntu-latest
    needs: [version, managed, fetch]
    env:
      VPK_CHANNEL: linux
      VPK_OUTPUT_DIR: Releases
    steps:
      - uses: actions/checkout@master

      - uses: actions/download-artifact@v3
        with:
          name: managed-il
          path: /tmp/managed-il

      - uses: actions/download-artifact@v3
        with:
          name: appdir
          path: CringeLauncher.AppDir

      - uses: actions/setup-dotnet@v5

      - name: Lay managed IL into AppDir
        run: |
          mkdir -p CringeLauncher.AppDir/usr/share/CringeLauncher
          tar -xf /tmp/managed-il/managed-il.tar -C CringeLauncher.AppDir/usr/share/CringeLauncher

      - name: Launcher-owned extras
        run: |
          curl -LOH 'Authorization: token ${{ secrets.GITHUB_TOKEN }}' https://git.zznty.net/nova/jediterm/releases/download/native-image/jediterm.tar.xz
          curl -LO https://github.com/SteamRE/DepotDownloader/releases/latest/download/DepotDownloader-framework.zip
          mkdir -p CringeLauncher.AppDir/usr
          tar -pxf jediterm.tar.xz -C CringeLauncher.AppDir/usr
          mkdir -p CringeLauncher.AppDir/usr/share/DepotDownloader
          unzip DepotDownloader-framework.zip -d CringeLauncher.AppDir/usr/share/DepotDownloader
          rm jediterm.tar.xz DepotDownloader-framework.zip
          ln -s ../share/CringeLauncher/CringeBootstrap ./CringeLauncher.AppDir/usr/bin/CringeBootstrap
          ln -s ./usr/share/CringeLauncher/Resources/splash.png ./CringeLauncher.AppDir/CringeLauncher.png
          ln -s ./usr/share/CringeLauncher/CringeLauncher.desktop ./CringeLauncher.AppDir/CringeLauncher.desktop
          cp ./CringeBootstrap/Properties/AppRun ./CringeLauncher.AppDir/AppRun
          curl -Lo ./CringeLauncher.AppDir/usr/lib/d3dcompiler_47.dll https://github.com/mozilla/fxc2/raw/refs/heads/master/dll/d3dcompiler_47.dll
          sudo apt update && sudo apt install -y squashfs-tools

      - name: Fetch runtime debug symbols
        run: |
          RUNTIME_DIR=$(echo ./CringeLauncher.AppDir/usr/share/dotnet/shared/Microsoft.NETCore.App/*)
          FXR_DIR=$(echo ./CringeLauncher.AppDir/usr/share/dotnet/host/fxr/*)
          dotnet tool install -g dotnet-symbol
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet-symbol --microsoft-symbol-server --symbols --modules --debugging \
            -o "$RUNTIME_DIR" -d "$RUNTIME_DIR"/*.so || true
          dotnet-symbol --microsoft-symbol-server --symbols --modules --debugging \
            -o "$FXR_DIR" -d "$FXR_DIR"/*.so || true
          dotnet-symbol --microsoft-symbol-server --symbols --modules \
            -o "$RUNTIME_DIR" -d "$RUNTIME_DIR"/*.dll || true
          ls -la "$RUNTIME_DIR" | grep -cE '\.dbg|\.pdb' || true
          count=$(ls "$RUNTIME_DIR" | grep -cE '\.dbg$|\.pdb$' || true)
          if [ "$count" -eq 0 ]; then
            echo "::warning::no runtime symbols fetched — crash symbolication will be degraded"
          fi

      - name: Precompile symbol caches
        run: |
          RUNTIME_DIR=$(echo ./CringeLauncher.AppDir/usr/share/dotnet/shared/Microsoft.NETCore.App/*)
          FXR_DIR=$(echo ./CringeLauncher.AppDir/usr/share/dotnet/host/fxr/*)
          ./CringeLauncher.AppDir/usr/bin/symbolic-crash precompile \
            "$RUNTIME_DIR" "$FXR_DIR" \
            ./CringeLauncher.AppDir/usr/share/CringeLauncher || true

      - run: dotnet tool install -g vpk
        name: Install VPK
      - run: ~/.dotnet/tools/vpk download s3 --bucket $VPK_BUCKET --endpoint $VPK_ENDPOINT
        name: Download previous release
        env:
          VPK_KEY_ID: ${{ secrets.S3_KEY_ID }}
          VPK_SECRET: ${{ secrets.S3_SECRET }}
          VPK_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          VPK_BUCKET: ${{ secrets.S3_BUCKET }}
          VPK_PREFIX: CringeLauncher

      - run: ~/.dotnet/tools/vpk pack -u $VPK_PACK_ID -v $VPK_PACK_VERSION -p $VPK_PACK_DIR --noDefaultExclude
        name: Pack Project
        env:
          VPK_RUNTIME: linux-x64
          VPK_PACK_ID: CringeLauncher
          VPK_PACK_VERSION: ${{ needs.version.outputs.version }}
          VPK_PACK_AUTHORS: zznty
          VPK_PACK_TITLE: SE Cringe Launcher
          VPK_PACK_DIR: ./CringeLauncher.AppDir
          VPK_MAIN_EXE: CringeBootstrap
          VPK_NO_PORTABLE: true
          VPK_SHORTCUTS: 'None'
          VPK_EXCLUDE: ''

      - run: ~/.dotnet/tools/vpk upload s3 -o $VPK_OUTPUT_DIR --bucket $VPK_BUCKET --endpoint $VPK_ENDPOINT
        name: Upload new release
        env:
          VPK_KEY_ID: ${{ secrets.S3_KEY_ID }}
          VPK_SECRET: ${{ secrets.S3_SECRET }}
          VPK_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          VPK_BUCKET: ${{ secrets.S3_BUCKET }}
          VPK_PREFIX: CringeLauncher
          VPK_KEEP_MAX_RELEASES: 15

      - run: ~/.dotnet/tools/vpk upload s3 -o $VPK_OUTPUT_DIR --bucket $VPK_BUCKET --endpoint $VPK_ENDPOINT
        name: Upload new release to mirror
        env:
          VPK_KEY_ID: ${{ secrets.MIRROR_S3_KEY_ID }}
          VPK_SECRET: ${{ secrets.MIRROR_S3_SECRET }}
          VPK_ENDPOINT: ${{ secrets.MIRROR_S3_ENDPOINT }}
          VPK_BUCKET: ${{ secrets.MIRROR_S3_BUCKET }}
          VPK_KEEP_MAX_RELEASES: 15
