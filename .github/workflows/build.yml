name: Build

on:
  push:
    branches: [master, preview]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_ROLL_FORWARD: LatestMajor

jobs:
  compute-version:
    name: Compute Version
    runs-on: ubuntu-latest
    if: "!contains(github.event.commits[0].message, '[skip ci]')"
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@master
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
        
      - id: version
        uses: paulhatch/semantic-version@v5.3.0
        with:
          tag_prefix: ''
          major_pattern: 'breaking:'
          minor_pattern: 'feature:'
          bump_each_commit: true
          version_format: ${{ github.ref_name == 'master' && '${major}.${minor}.${patch}' || '${major}.${minor}.${patch}-preview.${increment}' }}
          
  build-nuget:
    name: Build Nuget package
    runs-on: ubuntu-latest
    if: "!contains(github.event.commits[0].message, '[skip ci]')"
    needs: [compute-version]
    strategy: 
      matrix:
        project: [CringeBootstrap.Abstractions, NuGet, SharedCringe, CringePlugins]
    steps:
      - uses: actions/checkout@master
        
      - uses: actions/setup-dotnet@v5
        
      - run: dotnet restore ${{ matrix.project }}/${{ matrix.project }}.csproj --locked-mode
        name: Restore Project
        
      - run: dotnet pack -c Release -o ./pub ${{ matrix.project }}/${{ matrix.project }}.csproj --no-restore -p:Version="${{ needs.compute-version.outputs.version }}"
        name: Pack Project
        
      - name: Push Project
        run: dotnet nuget push --skip-duplicate -s https://ng.zznty.ru/v3/index.json -k ${{ secrets.NUGET_API_KEY  }} ./pub/${{ matrix.project }}.${{ needs.compute-version.outputs.version }}.nupkg
  
  build:
    name: Build Launcher
    runs-on: ubuntu-latest
    if: "!contains(github.event.commits[0].message, '[skip ci]')"
    needs: [compute-version]
    env:
      VPK_CHANNEL: ${{ github.ref_name == 'master' && 'win' || 'win-preview' }}
      VPK_OUTPUT_DIR: Releases
    steps:
      - uses: actions/checkout@master

      - uses: actions/setup-dotnet@v5

      - run: dotnet publish -c Release -o ./pub CringeBootstrap/CringeBootstrap.csproj -p:Version="${{ needs.compute-version.outputs.version }}" -r win-x64 --no-self-contained -f net10.0-windows10.0.19041.0
        name: Build Project

      - run: dotnet tool install -g vpk
      
      - run: ~/.dotnet/tools/vpk download s3 --bucket $VPK_BUCKET --endpoint $VPK_ENDPOINT
        name: Download previous release
        env:
          VPK_KEY_ID: ${{ secrets.S3_KEY_ID }}
          VPK_SECRET: ${{ secrets.S3_SECRET }}
          VPK_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          VPK_BUCKET: ${{ secrets.S3_BUCKET }}
          VPK_PREFIX: CringeLauncher
      
      - run: ~/.dotnet/tools/vpk [win] pack -u $VPK_PACK_ID -v $VPK_PACK_VERSION -p $VPK_PACK_DIR
        name: Pack Project
        env:
          VPK_RUNTIME: win-x64
          VPK_PACK_ID: CringeLauncher
          VPK_PACK_VERSION: ${{ needs.compute-version.outputs.version }}
          VPK_PACK_AUTHORS: zznty
          VPK_PACK_TITLE: SE Cringe Launcher
          VPK_PACK_DIR: ./pub
          VPK_MAIN_EXE: CringeBootstrap.exe
          VPK_NO_PORTABLE: true
          VPK_FRAMEWORK: net10.0-x64-desktop,vcredist120-x64,vcredist143-x64
          VPK_SHORTCUTS: 'None'
          VPK_EXCLUDE: ''
          
      - run: ~/.dotnet/tools/vpk upload s3 -o $VPK_OUTPUT_DIR --bucket $VPK_BUCKET --endpoint $VPK_ENDPOINT
        name: Upload new release
        env:
          VPK_KEY_ID: ${{ secrets.S3_KEY_ID }}
          VPK_SECRET: ${{ secrets.S3_SECRET }}
          VPK_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          VPK_BUCKET: ${{ secrets.S3_BUCKET }}
          VPK_PREFIX: CringeLauncher
          VPK_KEEP_MAX_RELEASES: 15

      - run: ~/.dotnet/tools/vpk upload s3 -o $VPK_OUTPUT_DIR --bucket $VPK_BUCKET --endpoint $VPK_ENDPOINT
        name: Upload new release to mirror
        env:
          VPK_KEY_ID: ${{ secrets.MIRROR_S3_KEY_ID }}
          VPK_SECRET: ${{ secrets.MIRROR_S3_SECRET }}
          VPK_ENDPOINT: ${{ secrets.MIRROR_S3_ENDPOINT }}
          VPK_BUCKET: ${{ secrets.MIRROR_S3_BUCKET }}
          VPK_KEEP_MAX_RELEASES: 15
  
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    if: "!contains(github.event.commits[0].message, '[skip ci]')"
    needs: [compute-version]
    env:
      VPK_CHANNEL: linux
      VPK_OUTPUT_DIR: Releases
    steps:
      - uses: actions/checkout@master

      - uses: actions/setup-dotnet@v5
        
      - name: Download ProjectNova
        run: |
          curl -LOH 'Authorization: token ${{ secrets.GITHUB_TOKEN }}' https://git.zznty.ru/nova/ProjectNova/releases/download/latest/nova.tar.xz
          curl -LOH 'Authorization: token ${{ secrets.GITHUB_TOKEN }}' https://git.zznty.ru/nova/jediterm/releases/download/native-image/jediterm.tar.xz
          mkdir -p CringeLauncher.AppDir/usr
          tar -pxf nova.tar.xz -C CringeLauncher.AppDir/usr
          tar -pxf jediterm.tar.xz -C CringeLauncher.AppDir/usr
          rm nova.tar.xz jediterm.tar.xz
        
      - run: dotnet publish CringeBootstrap/CringeBootstrap.csproj -c Release -r linux-x64 -o ./CringeLauncher.AppDir/usr/share/CringeLauncher --no-self-contained -f net10.0
        name: Publish Project
    
      - run: |
          ln -s ../share/CringeLauncher/CringeBootstrap ./CringeLauncher.AppDir/usr/bin/CringeBootstrap
          ln -s ./usr/share/CringeLauncher/Resources/splash.png ./CringeLauncher.AppDir/CringeLauncher.png
          ln -s ./usr/share/CringeLauncher/CringeLauncher.desktop ./CringeLauncher.AppDir/CringeLauncher.desktop
          cp ./CringeBootstrap/Properties/AppRun ./CringeLauncher.AppDir/AppRun
          curl -LO https://dot.net/v1/dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --install-dir ./CringeLauncher.AppDir/usr/share/dotnet --channel 10.0 --runtime dotnet
          ln -s ../share/dotnet/dotnet ./CringeLauncher.AppDir/usr/bin/dotnet
          rm dotnet-install.sh
          sudo apt update && sudo apt install -y squashfs-tools
        name: Prepare AppDir

      - run: dotnet tool install -g vpk
        name: Install VPK

      - run: ~/.dotnet/tools/vpk download s3 --bucket $VPK_BUCKET --endpoint $VPK_ENDPOINT
        name: Download previous release
        env:
          VPK_KEY_ID: ${{ secrets.S3_KEY_ID }}
          VPK_SECRET: ${{ secrets.S3_SECRET }}
          VPK_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          VPK_BUCKET: ${{ secrets.S3_BUCKET }}
          VPK_PREFIX: CringeLauncher
          
      - run: ~/.dotnet/tools/vpk pack -u $VPK_PACK_ID -v $VPK_PACK_VERSION -p $VPK_PACK_DIR
        name: Pack Project
        env:
          VPK_RUNTIME: linux-x64
          VPK_PACK_ID: CringeLauncher
          VPK_PACK_VERSION: ${{ needs.compute-version.outputs.version }}
          VPK_PACK_AUTHORS: zznty
          VPK_PACK_TITLE: SE Cringe Launcher
          VPK_PACK_DIR: ./CringeLauncher.AppDir
          VPK_MAIN_EXE: CringeBootstrap
          VPK_NO_PORTABLE: true
          VPK_SHORTCUTS: 'None'
          VPK_EXCLUDE: ''

      - run: ~/.dotnet/tools/vpk upload s3 -o $VPK_OUTPUT_DIR --bucket $VPK_BUCKET --endpoint $VPK_ENDPOINT
        name: Upload new release
        env:
          VPK_KEY_ID: ${{ secrets.S3_KEY_ID }}
          VPK_SECRET: ${{ secrets.S3_SECRET }}
          VPK_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          VPK_BUCKET: ${{ secrets.S3_BUCKET }}
          VPK_PREFIX: CringeLauncher
          VPK_KEEP_MAX_RELEASES: 15

      - run: ~/.dotnet/tools/vpk upload s3 -o $VPK_OUTPUT_DIR --bucket $VPK_BUCKET --endpoint $VPK_ENDPOINT
        name: Upload new release to mirror
        env:
          VPK_KEY_ID: ${{ secrets.MIRROR_S3_KEY_ID }}
          VPK_SECRET: ${{ secrets.MIRROR_S3_SECRET }}
          VPK_ENDPOINT: ${{ secrets.MIRROR_S3_ENDPOINT }}
          VPK_BUCKET: ${{ secrets.MIRROR_S3_BUCKET }}
          VPK_KEEP_MAX_RELEASES: 15
