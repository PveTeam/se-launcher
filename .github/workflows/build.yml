name: Build

on:
  push:
    branches: [master, preview]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_ROLL_FORWARD: LatestMajor

jobs:
  compute-version:
    name: Compute Version
    runs-on: ubuntu-latest
    if: "!contains(github.event.commits[0].message, '[skip ci]')"
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@master
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
        
      - id: version
        uses: paulhatch/semantic-version@v5.3.0
        with:
          tag_prefix: ''
          major_pattern: 'breaking:'
          minor_pattern: 'feature:'
          bump_each_commit: true
          version_format: ${{ github.ref_name == 'master' && '${major}.${minor}.${patch}' || '${major}.${minor}.${patch}-preview.${increment}' }}
          
  build-nuget:
    name: Build Nuget packages
    runs-on: ubuntu-latest
    if: "!contains(github.event.commits[0].message, '[skip ci]')"
    needs: [compute-version]
    steps:
      - uses: actions/checkout@master
        
      - uses: actions/setup-dotnet@v5
        
      - run: dotnet pack -c Release -o ./pub -p:Version="${{ needs.compute-version.outputs.version }}"
        name: Pack Projects
        
      - name: Push Projects
        run: dotnet nuget push --skip-duplicate -s https://ng.zznty.ru/v3/index.json -k ${{ secrets.NUGET_API_KEY  }} ./pub/*.nupkg
  
  build:
    name: Build Launcher
    runs-on: ubuntu-latest
    if: "!contains(github.event.commits[0].message, '[skip ci]')"
    needs: [compute-version]
    env:
      VPK_CHANNEL: ${{ github.ref_name == 'master' && 'win' || 'win-preview' }}
      VPK_OUTPUT_DIR: Releases
    steps:
      - uses: actions/checkout@master

      - uses: actions/setup-dotnet@v5

      - run: dotnet publish -c Release -o ./pub CringeBootstrap/CringeBootstrap.csproj -p:Version="${{ needs.compute-version.outputs.version }}" -r win-x64 --no-self-contained -f net10.0-windows10.0.19041.0
        name: Build Project

      - run: dotnet tool install -g vpk
      
      - run: ~/.dotnet/tools/vpk download s3 --bucket $VPK_BUCKET --endpoint $VPK_ENDPOINT
        name: Download previous release
        env:
          VPK_KEY_ID: ${{ secrets.S3_KEY_ID }}
          VPK_SECRET: ${{ secrets.S3_SECRET }}
          VPK_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          VPK_BUCKET: ${{ secrets.S3_BUCKET }}
          VPK_PREFIX: CringeLauncher
      
      - run: ~/.dotnet/tools/vpk [win] pack -u $VPK_PACK_ID -v $VPK_PACK_VERSION -p $VPK_PACK_DIR
        name: Pack Project
        env:
          VPK_RUNTIME: win-x64
          VPK_PACK_ID: CringeLauncher
          VPK_PACK_VERSION: ${{ needs.compute-version.outputs.version }}
          VPK_PACK_AUTHORS: zznty
          VPK_PACK_TITLE: SE Cringe Launcher
          VPK_PACK_DIR: ./pub
          VPK_MAIN_EXE: CringeBootstrap.exe
          VPK_NO_PORTABLE: true
          VPK_FRAMEWORK: net10.0-x64-desktop,vcredist120-x64,vcredist143-x64
          VPK_SHORTCUTS: 'None'
          VPK_EXCLUDE: ''
          
      - run: ~/.dotnet/tools/vpk upload s3 -o $VPK_OUTPUT_DIR --bucket $VPK_BUCKET --endpoint $VPK_ENDPOINT
        name: Upload new release
        env:
          VPK_KEY_ID: ${{ secrets.S3_KEY_ID }}
          VPK_SECRET: ${{ secrets.S3_SECRET }}
          VPK_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          VPK_BUCKET: ${{ secrets.S3_BUCKET }}
          VPK_PREFIX: CringeLauncher
          VPK_KEEP_MAX_RELEASES: 15

      - run: ~/.dotnet/tools/vpk upload s3 -o $VPK_OUTPUT_DIR --bucket $VPK_BUCKET --endpoint $VPK_ENDPOINT
        name: Upload new release to mirror
        env:
          VPK_KEY_ID: ${{ secrets.MIRROR_S3_KEY_ID }}
          VPK_SECRET: ${{ secrets.MIRROR_S3_SECRET }}
          VPK_ENDPOINT: ${{ secrets.MIRROR_S3_ENDPOINT }}
          VPK_BUCKET: ${{ secrets.MIRROR_S3_BUCKET }}
          VPK_KEEP_MAX_RELEASES: 15
